name: Build and Release Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PLUGIN_NAME: logseq-task-dashboard

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        run: |
          mkdir -p ${{ env.PLUGIN_NAME }}
          cp -r dist icon.png package.json README.md LICENSE ${{ env.PLUGIN_NAME }}/
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            package.json
          generate_release_notes: true
          draft: false
          prerelease: false
